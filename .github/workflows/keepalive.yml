# Mantiene activo el proyecto gratuito de Supabase (se pausa tras 7 días sin actividad).
# Requiere los secretos del repositorio SUPABASE_URL y SUPABASE_KEY
# (GitHub > Settings > Secrets and variables > Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 8 * * 1,4'   # lunes y jueves a las 08:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Supabase aún no está configurado: no hay nada que mantener activo."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/eventos?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          test "$code" = "200"
